models:
  embedder: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3
  llm: gemini-2.5-flash

data:
  # Corpus GATED trên HuggingFace -> cần HF_TOKEN trong env mới tải được.
  # Dataset không có split "train"; vinmec_article_content = bài viết đầy đủ.
  dataset: urnus11/Vietnamese-Healthcare
  split: vinmec_article_content
  title_col: title
  content_col: content
  min_article_chars: 100        # ngắn hơn -> loại. Khớp Gate 0, đừng đổi tuỳ tiện.
  processed_dir: data/processed

  # CHÍNH SÁCH GÁN KHOA — DEC-016.
  # Bài thuộc khoa X nếu keyword của X nằm ở TIÊU ĐỀ **hoặc** xuất hiện >= ngưỡng
  # này trong (tiêu đề + thân bài). Từ vựng 2 khoa: config/specialties.yaml.
  #
  # ĐỔI SỐ NÀY = ĐỔI CORPUS, phải chạy lại Gate 0. 25 -> 727 tim_mach / 698
  # tieu_duong, title-hit 61%, ~8% Qdrant Cloud free 1GB cho cả 2 collection.
  # Nếu Tuần 3 thấy retrieval nhiễu thì nâng lên 30 (546/658, title-hit 72%).
  # Tái lập số: python scripts/policy_cost_audit.py
  specialty_min_keyword_count: 25

retrieval:
  hybrid: true          # dense + sparse (bge-m3)

  # CHỐT CHI PHÍ TUẦN 7 — DEC-042. Rerank chiếm ~99% thời gian mỗi truy vấn,
  # nên hai số dưới đây quyết định HF Spaces CPU free có dùng được hay không.
  #
  #   1024 + top20 -> 3,75s/cặp x 20 = 75,0s/truy vấn   (không deploy được)
  #    512 + top20 -> 1,72s/cặp x 20 = 34,5s/truy vấn
  #    512 + top10 -> 1,72s/cặp x 10 = 17,2s/truy vấn   <- ĐANG DÙNG
  #
  # Bằng chứng cho từng lần cắt (đo 2026-09-06/07, 12 câu nhóm E):
  #  - 1024 -> 512: mrr@5 sau rerank KHÔNG tụt (0,528 -> 0,542), recall không đổi.
  #  - 20 -> 10: hạng chunk của bài vàng xấu nhất là **7**, và recall@10 =
  #    recall@20 = 0,750 -> cắt xuống 10 không mất câu nào.
  #
  # ⚠️ ĐIỀU KIỆN ĐẢO QUYẾT ĐỊNH: biên chỉ còn 3 bậc (7 so với 10). Sau khi nhóm E
  # mở lên 35-40 câu (DEC-041) PHẢI đo lại hạng chunk; thấy câu nào >10 thì trả
  # top_k_dense về 20 và chấp nhận 34,5s.
  top_k_dense: 10       # số ứng viên lấy ra trước rerank
  top_k_rerank: 5       # số chunk giữ lại sau rerank
  rerank_max_length: 512  # cửa sổ subword của cross-encoder khi chấm cặp

chunking:
  size: 512             # ABLATION: chạy thêm 256 (Tuần 2)
  overlap: 50

grader:
  # 2 ngưỡng trên rerank score.
  #
  # ⛔ ĐÃ ĐO 2026-09-06 VÀ BỊ BÁC BỎ — DEC-039. GIỮ NGUYÊN SỐ, ĐỪNG NỐI VÀO
  # PIPELINE. Ở correct_threshold=0.6, **10/30 câu nhóm A/B vẫn được TRẢ LỜI**
  # (33% câu corpus không có tài liệu) — đi thẳng ngược claim của đề tài.
  # Quét ngưỡng ở ĐÚNG cấu hình triển khai (top_k_dense=10, rerank_max_length=512
  # — DEC-042) cho một **DẢI AN TOÀN** chứ không chỉ một điểm:
  #   A/B cao nhất  +2.15  |  E thứ 9  +3.12  ->  dải (+2.15, +3.12] rộng 0.97 logit
  #   điểm giữa dải: +2.63 logit = **sigmoid 0.933**
  # Trong cả dải đó: 9/12 câu E được trả lời, **0/30 câu A/B lọt lưới**.
  # (Cấu hình cũ max_length=1024 chỉ cho dải rộng 0.58 -> cắt cửa sổ subword
  #  làm ngưỡng DỄ đặt hơn, không chỉ rẻ hơn.) Bảng: docs/retrieval-eval-deploy.md
  #
  # KHÔNG đổi thành 0.9 ngay: ngưỡng đó chọn trên chính 42 câu dùng để đánh
  # giá, không có tập giữ lại. Ngưỡng thật vẫn chốt ở Tuần 6 từ đường cong
  # risk–coverage, BẮT BUỘC có tập giữ lại. Bảng quét: docs/retrieval-eval.md
  correct_threshold: 0.6     # score >= correct_threshold      -> CORRECT
  incorrect_threshold: 0.3   # score <  incorrect_threshold     -> INCORRECT
                             # ở giữa 2 ngưỡng                  -> AMBIGUOUS

corrective:
  max_iter: 1           # số lần rewrite tối đa khi INCORRECT (đúng 1 lần)

generation:
  temperature: 0.2

qdrant:
  # DEC-018 — chạy trên Qdrant Cloud (free 1GB), KHÔNG dựng Docker local.
  # URL cluster + API key nằm trong .env (không commit) — xem .env.example.
  # docker-compose.yml giữ lại làm phương án dự phòng offline.
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  # Tên gốc. Tuần 2 index HAI collection cho ablation chunk-size (DEC-004):
  # vimed_rag_256 và vimed_rag_512 — cả hai dùng ~8% free tier (DEC-016).
  collection: vimed_rag

index:
  # DEC-021 — tham số dựng chỉ mục (Tuần 2). Đổi số ở đây = phải embed lại.
  #
  # Mỗi size thành MỘT collection riêng: <qdrant.collection>_<size>.
  # Số chunk đã đo sẵn (DEC-020): 256 -> 10.246 · 512 -> 4.972.
  sizes: [256, 512]

  dense_dim: 1024       # bge-m3 dense. Đổi model = đổi số này = phải recreate.
  distance: Cosine      # bge-m3 huấn luyện với cosine similarity.

  # max_length tính bằng SUBWORD của bge-m3, KHÔNG cùng đơn vị với
  # chunking.size (chunker tách theo khoảng trắng). 512 từ tiếng Việt ~
  # 700-900 subword -> 1024 vừa đủ, không cắt cụt mà vẫn nhanh trên T4.
  max_length: 1024

  embed_batch: 16       # T4 16GB: 16 x 1024 subword vừa VRAM, không OOM.
  upsert_batch: 128     # số point/lần gửi lên Qdrant Cloud.
  use_fp16: true        # T4 có tensor core fp16; CPU thì build_index tự tắt.
