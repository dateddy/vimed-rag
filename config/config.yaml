models:
  embedder: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3

  # LLM vẫn là **gemini-2.5-flash** (tech stack CHỐT, không đổi) — chỉ đổi
  # ĐƯỜNG ĐI tới nó, từ Google AI Studio sang OpenRouter (DEC-054).
  # Lý do: free tier Google chỉ 20 lượt/NGÀY (DEC-053), không đủ cho Tuần 6
  # (~90 lượt) lẫn demo Tuần 7.
  #
  # ⚠️ TÊN MODEL KHÁC NHAU giữa hai cổng — đổi provider mà quên đổi tên là 404:
  #     openrouter -> google/gemini-2.5-flash
  #     google     -> gemini-2.5-flash
  llm: google/gemini-2.5-flash
  llm_provider: openrouter        # openrouter | google

data:
  # Corpus GATED trên HuggingFace -> cần HF_TOKEN trong env mới tải được.
  # Dataset không có split "train"; vinmec_article_content = bài viết đầy đủ.
  dataset: urnus11/Vietnamese-Healthcare
  split: vinmec_article_content
  title_col: title
  content_col: content
  min_article_chars: 100        # ngắn hơn -> loại. Khớp Gate 0, đừng đổi tuỳ tiện.
  processed_dir: data/processed

  # CHÍNH SÁCH GÁN KHOA — DEC-016.
  # Bài thuộc khoa X nếu keyword của X nằm ở TIÊU ĐỀ **hoặc** xuất hiện >= ngưỡng
  # này trong (tiêu đề + thân bài). Từ vựng 2 khoa: config/specialties.yaml.
  #
  # ĐỔI SỐ NÀY = ĐỔI CORPUS, phải chạy lại Gate 0. 25 -> 727 tim_mach / 698
  # tieu_duong, title-hit 61%, ~8% Qdrant Cloud free 1GB cho cả 2 collection.
  # Nếu Tuần 3 thấy retrieval nhiễu thì nâng lên 30 (546/658, title-hit 72%).
  # Tái lập số: python scripts/policy_cost_audit.py
  specialty_min_keyword_count: 25

retrieval:
  hybrid: true          # dense + sparse (bge-m3)

  # CHỐT CHI PHÍ TUẦN 7 — DEC-042. Rerank chiếm ~99% thời gian mỗi truy vấn,
  # nên hai số dưới đây quyết định HF Spaces CPU free có dùng được hay không.
  #
  #   1024 + top20 -> 3,75s/cặp x 20 = 75,0s/truy vấn   (không deploy được)
  #    512 + top20 -> 1,72s/cặp x 20 = 34,5s/truy vấn
  #    512 + top10 -> 1,72s/cặp x 10 = 17,2s/truy vấn   <- ĐANG DÙNG
  #
  # Bằng chứng cho từng lần cắt (đo 2026-09-06/07, 12 câu nhóm E):
  #  - 1024 -> 512: mrr@5 sau rerank KHÔNG tụt (0,528 -> 0,542), recall không đổi.
  #  - 20 -> 10: hạng chunk của bài vàng xấu nhất là **7**, và recall@10 =
  #    recall@20 = 0,750 -> cắt xuống 10 không mất câu nào.
  #
  # ⚠️ ĐIỀU KIỆN ĐẢO QUYẾT ĐỊNH: biên chỉ còn 3 bậc (7 so với 10). Sau khi nhóm E
  # mở lên 35-40 câu (DEC-041) PHẢI đo lại hạng chunk; thấy câu nào >10 thì trả
  # top_k_dense về 20 và chấp nhận 34,5s.
  top_k_dense: 10       # số ứng viên lấy ra trước rerank
  top_k_rerank: 5       # số chunk giữ lại sau rerank
  rerank_max_length: 512  # cửa sổ subword của cross-encoder khi chấm cặp

chunking:
  size: 512             # ABLATION: chạy thêm 256 (Tuần 2)
  overlap: 50

grader:
  # 2 ngưỡng trên rerank score (đã qua sigmoid — DEC-033).
  #
  # ✅ ĐÃ HIỆU CHỈNH BẰNG LOOCV 2026-09-08 — DEC-051, supersedes điều kiện
  # "phải có tập giữ lại" của DEC-039. Báo cáo: docs/threshold-calibration.md
  # Tái lập: python scripts/calibrate_threshold.py
  #
  #   ranh giới TRẢ LỜI/TỪ CHỐI = +2.430 logit = sigmoid 0.919
  #   LOOCV: coverage 17/21 = 81% (CI 60-92%) · leakage 0/30 = 0% (CI 0-11%)
  #
  # ⚠️⚠️ DẢI AMBIGUOUS PHẢI NẰM **TRÊN** RANH GIỚI, KHÔNG PHẢI DƯỚI.
  # Đây là cái bẫy đã suýt mắc khi đổi số: LOOCV giả định quyết định NHỊ PHÂN
  # (trả lời iff score >= 0.919), nhưng grader có BA trạng thái và AMBIGUOUS
  # vẫn TRẢ LỜI (ANSWER_WITH_CAUTION). Nếu để incorrect_threshold=0.3 như cũ
  # thì A-01 (sigmoid **0.8960**) rơi vào [0.3, 0.919) -> AMBIGUOUS -> trả lời,
  # và toàn bộ nhóm A/B cũng vậy. "Leakage 0/30" bốc hơi ngay.
  # => incorrect_threshold = ĐÚNG ranh giới hiệu chỉnh. Mọi thứ dưới nó phải
  #    INCORRECT -> rewrite -> ABSTAIN.
  #
  # correct_threshold = sigmoid(+2.635) = 0.933 — ngưỡng CAO NHẤT mà bất kỳ
  # fold LOOCV nào sinh ra. Câu rơi vào [0.919, 0.933) là câu mà ngưỡng đang
  # dùng thì trả lời nhưng một số fold khác đã từ chối => trả lời KÈM CẢNH BÁO.
  # Đó là cách dùng có căn cứ cho nhánh AMBIGUOUS, thay vì một số tuỳ ý.
  #
  # ⚠️ Dải này RỖNG ở phân bố LƯỢT TRUY HỒI ĐẦU (câu E thấp nhất được trả lời là
  # E-21 = 0.9375, ngay trên 0.933) — phân bố nhóm E lưỡng cực với vực 3.06
  # logit (DEC-051) nên không có ca sát biên.
  # NHƯNG điểm LƯỢT HAI thì lấp vào: A-08 sau rewrite ra sigmoid 0.9255, rơi
  # đúng vào dải. Nhánh ANSWER_WITH_CAUTION vì thế ĐÃ chạy trên dữ liệu thật —
  # và lần chạy đầu tiên của nó là trên một câu LỌT LƯỚI (DEC-056).
  #
  # ⛔ LỖ ĐÃ ĐO XONG, KẾT QUẢ XẤU: LOOCV chấm trên điểm của LƯỢT TRUY HỒI ĐẦU;
  # vòng corrective cho mỗi câu A/B một lần thử thứ hai chưa hiệu chỉnh.
  # Đo end-to-end 59 câu (DEC-056): lượt 1 leakage 0/30, nhưng LƯỢT 2 làm lọt
  # `A-01` và `A-08` -> leakage THẬT của hệ thống = **2/30 = 7%**, không phải 0%.
  # Rewrite đẩy điểm nhóm A/B lên hệ thống (Δlogit trung vị +0.876, p = 0.0052).
  # ⚠️ ĐỪNG vá bằng cách sửa hai số dưới đây: chúng hiệu chỉnh trên lượt 1, hạ
  # xuống là phá luôn con số DEC-051. Sửa đúng = đổi thứ được chấm ở LƯỢT 2.
  # Báo cáo: docs/leakage-after-rewrite.md
  correct_threshold: 0.933     # >= 0.933          -> CORRECT   -> ANSWER
  incorrect_threshold: 0.919   # <  0.919          -> INCORRECT -> rewrite/ABSTAIN
                               # [0.919, 0.933)    -> AMBIGUOUS -> ANSWER_WITH_CAUTION

corrective:
  max_iter: 1           # số lần rewrite tối đa khi INCORRECT (đúng 1 lần)

generation:
  temperature: 0.2

  # Hạn mức gọi API. `src/llm.py` tự giãn nhịp + thử lại khi 429/5xx.
  #
  # LỊCH SỬ SỐ NÀY — đừng hạ lại mà không biết vì sao:
  #   Google AI Studio free (DEC-053): **5 lượt/phút VÀ 20 lượt/NGÀY**. Hạn mức
  #   ngày là thứ đã chặn phương án B và sẽ chặn cả Tuần 6 (~90 lượt) lẫn demo
  #   Tuần 7 — không code nào lách được.
  #   OpenRouter (DEC-054, đang dùng): hạn mức theo credit, rộng hơn nhiều.
  #
  # 60 = 1 lượt/giây. Cố ý đặt THẤP hơn mức OpenRouter cho phép: một lô 59 câu
  # chạy trong ~1 phút vẫn thừa nhanh, mà không có nguy cơ bị chặn giữa chừng.
  requests_per_minute: 60

qdrant:
  # DEC-018 — chạy trên Qdrant Cloud (free 1GB), KHÔNG dựng Docker local.
  # URL cluster + API key nằm trong .env (không commit) — xem .env.example.
  # docker-compose.yml giữ lại làm phương án dự phòng offline.
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  # Tên gốc. Tuần 2 index HAI collection cho ablation chunk-size (DEC-004):
  # vimed_rag_256 và vimed_rag_512 — cả hai dùng ~8% free tier (DEC-016).
  collection: vimed_rag

index:
  # DEC-021 — tham số dựng chỉ mục (Tuần 2). Đổi số ở đây = phải embed lại.
  #
  # Mỗi size thành MỘT collection riêng: <qdrant.collection>_<size>.
  # Số chunk đã đo sẵn (DEC-020): 256 -> 10.246 · 512 -> 4.972.
  sizes: [256, 512]

  dense_dim: 1024       # bge-m3 dense. Đổi model = đổi số này = phải recreate.
  distance: Cosine      # bge-m3 huấn luyện với cosine similarity.

  # max_length tính bằng SUBWORD của bge-m3, KHÔNG cùng đơn vị với
  # chunking.size (chunker tách theo khoảng trắng). 512 từ tiếng Việt ~
  # 700-900 subword -> 1024 vừa đủ, không cắt cụt mà vẫn nhanh trên T4.
  max_length: 1024

  embed_batch: 16       # T4 16GB: 16 x 1024 subword vừa VRAM, không OOM.
  upsert_batch: 128     # số point/lần gửi lên Qdrant Cloud.
  use_fp16: true        # T4 có tensor core fp16; CPU thì build_index tự tắt.
