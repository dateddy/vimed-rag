# DỰ PHÒNG — không phải đường chạy chính.
# DEC-018: mặc định dùng Qdrant Cloud (free 1GB). File này chỉ dùng khi cần
# chạy offline; lúc đó đặt QDRANT_URL=http://localhost:6333 và bỏ trống API key.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vimed-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
